name: Create GitHub Release Draft

on:
  push:
    branches:
      - production

permissions:
  contents: write

jobs:
  create-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version (v0.0.N, auto-increment from existing releases)
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(gh release list -R "${{ github.repository }}" --limit 200 --json tagName -q '.[].tagName' \
            | grep -E '^v0\.0\.[0-9]+$' \
            | sed -E 's/^v0\.0\.//' \
            | sort -n | tail -1)
          NEXT=$(( ${LATEST:-0} + 1 ))
          echo "version_code=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=v0.0.$NEXT" >> "$GITHUB_OUTPUT"

      - name: Create release draft with auto-generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --draft \
            --generate-notes \
            --target "${{ github.sha }}" \
            --title "${{ steps.version.outputs.tag }}"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install git-crypt / yq
        run: |
          sudo apt-get update -y
          sudo apt-get install -y git-crypt
          curl -sL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          chmod +x /usr/local/bin/yq

      - name: Unlock secrets (git-crypt)
        env:
          GIT_CRYPT_KEY_BASE64: ${{ secrets.GIT_CRYPT_KEY_BASE64 }}
        run: |
          echo "$GIT_CRYPT_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/git-crypt-key"
          git-crypt unlock "$RUNNER_TEMP/git-crypt-key"
          rm -f "$RUNNER_TEMP/git-crypt-key"

      - name: Write .env
        run: |
          {
            echo "SUPABASE_URL=$(yq -r '.SUPABASE_URL' secrets/ci.yaml)"
            echo "SUPABASE_ANON_KEY=$(yq -r '.SUPABASE_ANON_KEY' secrets/ci.yaml)"
            echo "GOOGLE_OAUTH_CLIENT_ID=$(yq -r '.GOOGLE_OAUTH_CLIENT_ID' secrets/ci.yaml)"
            echo "FLUTTER_APP_ENV=prod"
          } > .env

      - name: Restore google-services.json
        run: yq -r '.GOOGLE_SERVICES_JSON' secrets/ci.yaml > android/app/google-services.json

      - name: Restore upload keystore
        run: yq -r '.ANDROID_KEYSTORE_BASE64' secrets/ci.yaml | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Build signed App Bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
        run: |
          ANDROID_KEYSTORE_PASSWORD="$(yq -r '.ANDROID_KEYSTORE_PASSWORD' secrets/ci.yaml)"
          ANDROID_KEY_ALIAS="$(yq -r '.ANDROID_KEY_ALIAS' secrets/ci.yaml)"
          ANDROID_KEY_PASSWORD="$(yq -r '.ANDROID_KEY_PASSWORD' secrets/ci.yaml)"
          export ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD
          flutter pub get
          flutter build appbundle --release \
            --build-name="0.0.${{ steps.version.outputs.version_code }}" \
            --build-number="${{ steps.version.outputs.version_code }}"

      - name: Remove decrypted secrets
        if: always()
        run: |
          git-crypt lock || true
          rm -f "$RUNNER_TEMP/upload-keystore.jks"

      - name: Attach App Bundle to draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.version.outputs.tag }}" build/app/outputs/bundle/release/app-release.aab --clobber
