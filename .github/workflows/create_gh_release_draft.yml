name: Create GitHub Release Draft

on:
  push:
    branches:
      - production

permissions:
  contents: write

jobs:
  create-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version (v0.0.N, auto-increment from existing releases)
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(gh release list -R "${{ github.repository }}" --limit 200 --json tagName -q '.[].tagName' \
            | grep -E '^v0\.0\.[0-9]+$' \
            | sed -E 's/^v0\.0\.//' \
            | sort -n | tail -1)
          NEXT=$(( ${LATEST:-0} + 1 ))
          echo "version_code=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=v0.0.$NEXT" >> "$GITHUB_OUTPUT"

      - name: Create release draft with auto-generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --draft \
            --generate-notes \
            --target "${{ github.sha }}" \
            --title "${{ steps.version.outputs.tag }}"
