name: Deploy to Play Store

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Download App Bundle attached to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ github.event.release.tag_name }}" -R "${{ github.repository }}" -p "app-release.aab"

      - name: Write Play Store release notes (whatsnew)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p android/whatsnew
          gh release view "${{ github.event.release.tag_name }}" --json body -q .body \
            | sed '/^#/d' \
            | cut -c1-500 \
            > android/whatsnew/whatsnew-ja-JP

      - name: Deploy to Google Play (production track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.minnya.renga
          releaseFiles: app-release.aab
          track: production
          whatsNewDirectory: android/whatsnew
