name: Deploy to Play Store

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download App Bundle attached to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ github.event.release.tag_name }}" -R "${{ github.repository }}" -p "app-release.aab"

      - name: Write Play Store release notes (whatsnew)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p android/whatsnew
          gh release view "${{ github.event.release.tag_name }}" --json body -q .body \
            | sed '/^#/d' \
            | cut -c1-500 \
            > android/whatsnew/whatsnew-ja-JP

      - name: Install git-crypt / yq
        run: |
          sudo apt-get update -y
          sudo apt-get install -y git-crypt
          curl -sL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          chmod +x /usr/local/bin/yq

      - name: Unlock secrets (git-crypt)
        env:
          GIT_CRYPT_KEY_BASE64: ${{ secrets.GIT_CRYPT_KEY_BASE64 }}
        run: |
          echo "$GIT_CRYPT_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/git-crypt-key"
          git-crypt unlock "$RUNNER_TEMP/git-crypt-key"
          rm -f "$RUNNER_TEMP/git-crypt-key"

      - name: Extract Google Play service account
        run: yq -r '.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON' secrets/ci.yaml > "$RUNNER_TEMP/play-service-account.json"

      - name: Deploy to Google Play (production track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ runner.temp }}/play-service-account.json
          packageName: com.minnya.renga
          releaseFiles: app-release.aab
          track: production
          whatsNewDirectory: android/whatsnew

      - name: Remove decrypted secrets
        if: always()
        run: |
          git-crypt lock || true
          rm -f "$RUNNER_TEMP/play-service-account.json"
