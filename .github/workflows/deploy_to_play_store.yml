name: Deploy to Play Store

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download App Bundle attached to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ github.event.release.tag_name }}" -R "${{ github.repository }}" -p "app-release.aab"

      - name: Write Play Store release notes (whatsnew)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p android/whatsnew
          gh release view "${{ github.event.release.tag_name }}" --json body -q .body \
            | sed '/^#/d' \
            | cut -c1-500 \
            > android/whatsnew/whatsnew-ja-JP

      - name: Install sops
        run: |
          curl -sL -o /usr/local/bin/sops https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64
          chmod +x /usr/local/bin/sops

      - name: Decrypt Google Play service account (SOPS)
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          sops --decrypt --extract '["GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"]' secrets/ci.enc.yaml > "$RUNNER_TEMP/play-service-account.json"

      - name: Deploy to Google Play (production track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ runner.temp }}/play-service-account.json
          packageName: com.minnya.renga
          releaseFiles: app-release.aab
          track: production
          whatsNewDirectory: android/whatsnew

      - name: Remove decrypted service account
        if: always()
        run: rm -f "$RUNNER_TEMP/play-service-account.json"
