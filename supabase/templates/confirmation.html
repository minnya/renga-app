<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rengaへようこそ</title>
</head>
<body style="margin:0; padding:0; background-color:#0b0d14; font-family:'Segoe UI','Hiragino Kaku Gothic ProN',Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0b0d14; padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px; width:100%; background-color:#171b28; border:1px solid #262b3d; border-radius:20px; padding:40px 32px; text-align:center;">
          <tr>
            <td align="center" style="padding-bottom:24px;">
              <img src="https://minnya.github.io/chatapp-renga/assets/icon/renga_icon_1024.png" width="72" height="72" alt="Renga" style="display:block; border-radius:16px;">
            </td>
          </tr>
          <tr>
            <td align="center" style="padding-bottom:8px;">
              <span style="font-size:22px; font-weight:700; letter-spacing:-0.02em; color:#f3f4f8;">Rengaへようこそ！</span>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding-bottom:28px;">
              <span style="font-size:15px; line-height:1.6; color:#9ba0b3;">
                ご登録ありがとうございます。<br>
                以下のボタンからメールアドレスの確認を完了してください。
              </span>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding-bottom:28px;">
              <a href="{{ .ConfirmationURL }}" style="display:inline-block; padding:14px 32px; border-radius:12px; background:linear-gradient(90deg,#ff7a45,#4f6bff); color:#ffffff; font-size:15px; font-weight:700; text-decoration:none;">
                メールアドレスを確認する
              </a>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding-bottom:4px;">
              <span style="font-size:12px; line-height:1.6; color:#565b6e;">
                ボタンが機能しない場合は、以下のリンクをブラウザに貼り付けてください。<br>
                <a href="{{ .ConfirmationURL }}" style="color:#7ee0ff; word-break:break-all;">{{ .ConfirmationURL }}</a>
              </span>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding-top:24px; border-top:1px solid #262b3d; margin-top:24px;">
              <span style="font-size:12px; color:#565b6e;">
                心当たりがない場合は、このメールを破棄してください。<br>
                お問い合わせ: <a href="mailto:support@renga-app.com" style="color:#565b6e;">support@renga-app.com</a>
              </span>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
